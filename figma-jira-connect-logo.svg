<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Interlocking shapes concept -->
  <defs>
    <linearGradient id="designGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F24E1E"/>
      <stop offset="50%" style="stop-color:#A259FF"/>
      <stop offset="100%" style="stop-color:#1ABCFE"/>
    </linearGradient>
  </defs>
  
  <!-- Design shape (Figma-inspired rounded rectangle) -->
  <rect x="12" y="16" width="20" height="32" rx="6" fill="url(#designGradient)" opacity="0.9"/>
  
  <!-- Issue shape (Jira-inspired square with corner cut) -->
  <path d="M 32 20 L 48 20 L 48 44 L 32 44 L 32 36 L 40 28 L 32 28 Z" fill="#0052CC" opacity="0.8"/>
  
  <!-- Integration point - small circle where they connect -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
</svg>