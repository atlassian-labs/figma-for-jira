<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Sync concept: Circular arrows connecting design and development elements -->
  <defs>
    <linearGradient id="syncGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F24E1E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central sync arrows in a circle -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#syncGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- Design element (top-left) -->
  <circle cx="35" cy="35" r="8" fill="#F24E1E" opacity="0.9"/>
  <circle cx="35" cy="35" r="4" fill="white" opacity="0.8"/>
  
  <!-- Development element (bottom-right) -->
  <rect x="57" y="57" width="16" height="16" rx="2" fill="#0052CC" opacity="0.9"/>
  <rect x="60" y="60" width="10" height="2" rx="1" fill="white" opacity="0.9"/>
  <rect x="60" y="64" width="8" height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="60" y="68" width="6" height="2" rx="1" fill="white" opacity="0.7"/>
  
  <!-- Sync arrows -->
  <path d="M 42 40 Q 50 30, 58 38" stroke="url(#syncGradient)" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 58 62 Q 50 70, 42 62" stroke="url(#syncGradient)" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#syncGradient)" opacity="0.8"/>
    </marker>
  </defs>
  
  <!-- Central connection point -->
  <circle cx="50" cy="50" r="3" fill="#7C3AED" opacity="0.8"/>
</svg>