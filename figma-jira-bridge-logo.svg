<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bridge concept: Two circles connected by flowing lines -->
  <defs>
    <linearGradient id="figmaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F24E1E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7262;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A259FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jiraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2684FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Figma side (left circle with design elements) -->
  <circle cx="25" cy="50" r="18" fill="url(#figmaGradient)" opacity="0.9"/>
  <circle cx="25" cy="50" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
  
  <!-- Connection bridge (flowing curves) -->
  <path d="M 43 45 Q 50 35, 57 45" stroke="#666" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 43 50 Q 50 50, 57 50" stroke="#666" stroke-width="2" fill="none" opacity="0.9"/>
  <path d="M 43 55 Q 50 65, 57 55" stroke="#666" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Jira side (right circle with ticket/task elements) -->
  <circle cx="75" cy="50" r="18" fill="url(#jiraGradient)" opacity="0.9"/>
  <rect x="69" y="44" width="12" height="8" rx="1" fill="white" opacity="0.8"/>
  <rect x="70" y="52" width="10" height="2" rx="1" fill="white" opacity="0.6"/>
</svg>