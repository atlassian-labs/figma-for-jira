<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Bridge concept: Two circles connected by flowing curves -->
  <defs>
    <linearGradient id="figmaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F24E1E"/>
      <stop offset="100%" style="stop-color:#FF7262"/>
    </linearGradient>
    <linearGradient id="jiraGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0052CC"/>
      <stop offset="100%" style="stop-color:#2684FF"/>
    </linearGradient>
  </defs>
  
  <!-- Figma circle (design) -->
  <circle cx="18" cy="32" r="12" fill="url(#figmaGradient)"/>
  
  <!-- Jira circle (issues) -->
  <circle cx="46" cy="32" r="12" fill="url(#jiraGradient)"/>
  
  <!-- Connection bridge -->
  <path d="M 30 32 Q 32 22 34 32 Q 32 42 30 32" fill="none" stroke="#666" stroke-width="2" opacity="0.6"/>
  
  <!-- Small dots representing sync -->
  <circle cx="32" cy="28" r="1.5" fill="#666" opacity="0.4"/>
  <circle cx="32" cy="32" r="1.5" fill="#666" opacity="0.6"/>
  <circle cx="32" cy="36" r="1.5" fill="#666" opacity="0.4"/>
</svg>