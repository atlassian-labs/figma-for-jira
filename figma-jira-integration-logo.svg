<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Integration concept: Interlocking geometric shapes -->
  <defs>
    <linearGradient id="designGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F24E1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A259FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left shape representing Figma/Design -->
  <path d="M 15 20 L 45 20 Q 55 20, 55 30 L 55 45 Q 55 55, 45 55 L 30 55 Q 20 55, 20 45 L 20 35 Q 20 25, 30 25 L 40 25" 
        fill="url(#designGradient)" opacity="0.8"/>
  
  <!-- Right shape representing Jira/Development -->
  <rect x="45" y="35" width="35" height="35" rx="5" fill="#0052CC" opacity="0.8"/>
  <rect x="50" y="40" width="25" height="4" rx="2" fill="white" opacity="0.9"/>
  <rect x="50" y="48" width="20" height="3" rx="1.5" fill="white" opacity="0.7"/>
  <rect x="50" y="55" width="15" height="3" rx="1.5" fill="white" opacity="0.7"/>
  <circle cx="70" cy="62" r="3" fill="#2684FF"/>
  
  <!-- Overlapping area showing integration -->
  <ellipse cx="50" cy="45" rx="8" ry="12" fill="#7C3AED" opacity="0.6"/>
</svg>